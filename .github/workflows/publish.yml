name: Validate and publish AURA TV

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Build desktop startup package
        run: |
          npm run build
          node scripts/verify-pages.mjs
          python3 scripts/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-tv-windows
          path: release/*
          if-no-files-found: error
      - name: Build and verify GitHub Pages application
        run: |
          npm run build
          node scripts/verify-pages.mjs
        env:
          APP_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aura-tv-windows
          path: release
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/aura-tv-windows.zip release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/aura-tv-windows.zip release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "AURA TV $RELEASE_TAG" --notes-file docs/RELEASE.md --prerelease
          fi
